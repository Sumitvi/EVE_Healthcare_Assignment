services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diagnostics
      POSTGRES_USER: diagnostics
      POSTGRES_PASSWORD: diagnostics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diagnostics -d diagnostics"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/diagnostics
      DB_USERNAME: diagnostics
      DB_PASSWORD: diagnostics
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting Docker Compose}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET before starting Docker Compose}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL before starting Docker Compose}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting Docker Compose}
    ports:
      - "8080:8080"

volumes:
  pgdata:
